<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workers-in-Training Certification Exam - RCCG Portal</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-track="workers">

  <!-- Timer widget -->
  <div class="quiz-timer-widget" id="timer-widget" style="display: none;">
    <span>⏱ Time Left:</span>
    <span id="timer-time">30:00</span>
  </div>

  <header class="app-header">
    <div class="brand">
      <img src="../assets/images/rccg_logo.png" alt="RCCG Logo" class="brand-logo">
      <div>
        <span class="brand-name">Certification Exam</span>
        <span class="brand-subtitle">Workers-in-Training</span>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 40px; padding-bottom: 80px;">
    
    <!-- Registration Screen -->
    <section class="quiz-welcome-screen" id="registration-screen">
      <h2 style="font-family: var(--font-serif); font-size: 2rem; margin-bottom: 12px; color: var(--color-primary-dark)">Candidate Registration</h2>
      <p style="color: #64748b; margin-bottom: 30px; font-size: 0.95rem;">Please register with your details and department before starting. The exam consists of 30 randomized questions with a 30-minute timer.</p>
      
      <form onsubmit="startExamRegistration(event)">
        <div class="form-group">
          <label class="form-label" for="candidate-name">Full Name</label>
          <input type="text" id="candidate-name" class="form-input" placeholder="e.g. Samuel Oluwaseun Adeyemi" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="candidate-dob">Date of Birth</label>
          <input type="date" id="candidate-dob" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="candidate-phone">Phone Number</label>
          <input type="tel" id="candidate-phone" class="form-input" placeholder="e.g. +1 (123) 456-7890" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="candidate-dept">Department / Unit</label>
          <select id="candidate-dept" class="form-input">
            <option value="Choir">Choir</option>
            <option value="Prayer Band">Prayer Band</option>
            <option value="Ushering">Ushering</option>
            <option value="Teaching Department">Teaching Department</option>
            <option value="Sanitation">Sanitation</option>
            <option value="Engineering">Engineering</option>
            <option value="Welfare">Welfare</option>
            <option value="Evangelism/Drama">Evangelism / Drama</option>
            <option value="Children Teachers">Children Teachers</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <div style="display: flex; gap: 16px; justify-content: center; margin-top: 30px;">
          <a href="index.html" class="btn btn-outline">Back</a>
          <button type="submit" class="btn btn-primary" style="background: var(--color-gold);">Start Examination</button>
        </div>
      </form>
    </section>

    <!-- Quiz Question Screen -->
    <section class="quiz-question-container" id="exam-screen">
      <div class="study-card active" style="padding: 40px;">
        <div class="question-number" id="q-number">Question 1 of 30</div>
        <div class="question-text" id="q-text">Loading question...</div>
        
        <div class="quiz-options" id="q-options">
          <!-- Options rendered dynamically -->
        </div>

        <div style="display: flex; justify-content: space-between; border-top: 1px solid #e2e8f0; padding-top: 24px;">
          <button id="quiz-prev-btn" class="btn btn-outline" onclick="quizPrev()">← Previous</button>
          <button id="quiz-next-btn" class="btn btn-primary" onclick="quizNext()">Next Question →</button>
        </div>
      </div>
    </section>

    <!-- Result Screen -->
    <section id="result-screen" style="display: none;">
      <!-- Renders dynamically upon submit -->
    </section>

  </main>

  <!-- Load dependencies -->
  <script src="../assets/js/quizzes.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
