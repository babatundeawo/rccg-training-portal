<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baptismal Study Session - RCCG Portal</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-track="baptismal">

  <!-- Sticky Top Progress Bar -->
  <div class="progress-bar-container">
    <div id="progress-fill" class="progress-bar-fill"></div>
  </div>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand">
      <img src="../assets/images/rccg_logo.png" alt="RCCG Logo" class="brand-logo">
      <div>
        <span class="brand-name" id="header-title">Study Session</span>
        <span class="brand-subtitle" id="header-subtitle">Baptismal Manual</span>
      </div>
    </div>
    <button class="btn btn-outline" style="padding: 8px 16px; font-size: 0.9rem;" onclick="toggleDrawer()">🗺 Map</button>
  </header>

  <!-- Main Viewport -->
  <main class="container study-viewport">
    <div id="card-deck" class="card-deck">
      <!-- Dynamic cards loaded by script -->
    </div>
  </main>

  <!-- Sticky Bottom Actions -->
  <div class="bottom-actions">
    <a href="index.html" class="btn btn-outline">Dashboard</a>
    <div style="display: flex; gap: 12px;">
      <button id="prev-btn" class="btn btn-outline" onclick="prevCard()" disabled>← Prev</button>
      <button id="next-btn" class="btn btn-primary" onclick="nextCard()">Next →</button>
    </div>
  </div>

  <!-- You Are Here Map Drawer -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="toggleDrawer()"></div>
  <aside class="navigation-drawer" id="nav-drawer">
    <div class="drawer-header">
      <span class="drawer-title">Baptismal Study Map</span>
      <button class="scripture-modal-close" onclick="toggleDrawer()">✕</button>
    </div>
    <div class="drawer-content">
      <ul class="drawer-list" id="drawer-list">
        <!-- List generated dynamically -->
      </ul>
    </div>
  </aside>

  <!-- Scripture Reveal Modal -->
  <div class="scripture-modal" id="scripture-modal" onclick="closeScriptureModal()">
    <div class="scripture-modal-content" onclick="event.stopPropagation()">
      <div class="scripture-modal-header">
        <span class="scripture-modal-ref" id="scripture-ref">Scripture Reference</span>
        <button class="scripture-modal-close" onclick="closeScriptureModal()">✕</button>
      </div>
      <div class="scripture-modal-body" id="scripture-body">
        Scripture content will load here...
      </div>
      <span class="scripture-version">NEW KING JAMES VERSION (NKJV)</span>
    </div>
  </div>

  <!-- Load content databases and core scripts -->
  <script src="../assets/js/scriptures.js"></script>
  <script src="../assets/js/content-baptismal.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initStudyViewer("baptismal", BAPTISMAL_CONTENT);
    });
  </script>
</body>
</html>
